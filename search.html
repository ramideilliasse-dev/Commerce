<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Toma">

<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#ff6a00">

<title>Pesquisar produtos | Toma</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
}

/* HEADER */
.header {
    background: #ff6a00;
    padding: 15px;
    display: flex;
    gap: 10px;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
}

.back {
    background: white;
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
}

.searchBox {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: none;
    outline: none;
    border-radius: 10px;
    font-size: 16px;
}

/* SEARCH STATUS */
.searchStatus {
    padding: 12px 15px 0;
    color: #666;
    font-size: 14px;
}

/* PRODUCTS */
.products {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    padding: 10px;
}

.card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    cursor: pointer;
}

.card img {
    display: block;
    width: 100%;
    height: 140px;
    object-fit: cover;
    background: #eee;
}

.info {
    padding: 10px;
}

.name {
    font-weight: bold;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.desc {
    font-size: 12px;
    color: #666;
    margin-top: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.price {
    color: #ff6a00;
    font-weight: bold;
    margin-top: 5px;
}

.soldOut {
    background: #e53935;
    color: white;
    padding: 4px 8px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    display: inline-block;
    margin-top: 5px;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 30px;
    color: #777;
}

.error {
    grid-column: 1 / -1;
    text-align: center;
    padding: 30px;
    color: #b00020;
}

</style>
</head>

<body>

<header class="header">

    <button
        class="back"
        type="button"
        id="backButton"
        aria-label="Voltar">
        ←
    </button>

    <input
        type="search"
        id="searchInput"
        class="searchBox"
        placeholder="Pesquisar produtos..."
        aria-label="Pesquisar produtos"
        autocomplete="off"
    >

</header>

<div
    id="searchStatus"
    class="searchStatus"
    aria-live="polite">
</div>

<main id="products" class="products"></main>

<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const productsDiv = document.getElementById("products");
const searchInput = document.getElementById("searchInput");
const searchStatus = document.getElementById("searchStatus");
const backButton = document.getElementById("backButton");

let allProducts = [];

/* =====================================
   BLOC 1 — NORMALISER LE TEXTE
===================================== */

function normalizeText(value) {
    return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
}

/* =====================================
   BLOC 2 — CHARGER LES PRODUITS FIREBASE
===================================== */

async function loadProducts() {

    productsDiv.innerHTML = `
        <div class="empty">A carregar produtos...</div>
    `;

    try {

        const snap = await getDocs(
            collection(db, "products")
        );

        allProducts = [];

        snap.forEach(documentSnapshot => {

            const data = documentSnapshot.data();

            allProducts.push({
                ...data,
                id: documentSnapshot.id
            });

        });

        // Lire la recherche transmise par la page d'accueil.
        const params = new URLSearchParams(
            window.location.search
        );

        const initialQuery = params.get("q") || "";

        searchInput.value = initialQuery;

        // Afficher les produits correspondant à la recherche.
        filterProducts(initialQuery);

    } catch (error) {

        console.error(
            "[TOMA SEARCH] Erreur Firebase :",
            error
        );

        productsDiv.innerHTML = `
            <div class="error">
                Não foi possível carregar os produtos.
                Verifique a ligação à Internet e tente novamente.
            </div>
        `;

        searchStatus.textContent = "";

        alert(
            "Toma: não foi possível carregar os produtos. Tente novamente."
        );

    }

}

/* =====================================
   BLOC 3 — AFFICHER LES PRODUITS
===================================== */

function renderProducts(list) {

    if (list.length === 0) {

        productsDiv.innerHTML = `
            <div class="empty">
                Nenhum produto encontrado 😢
            </div>
        `;

        return;
    }

    productsDiv.innerHTML = "";

    list.forEach(product => {

        const card = document.createElement("article");
        card.className = "card";

        const image = document.createElement("img");

        const images = Array.isArray(product.images)
            ? product.images
            : [];

        image.src =
            images[0] ||
            product.image ||
            "https://placehold.co/300x200?text=Toma";

        image.alt = product.name || "Produto";
        image.loading = "lazy";

        image.onerror = function () {
            this.onerror = null;
            this.src =
                "https://placehold.co/300x200?text=Toma";
        };

        const info = document.createElement("div");
        info.className = "info";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = product.name || "Produto";

        const description = document.createElement("div");
        description.className = "desc";

        description.textContent = String(
            product.description || ""
        ).split("\n")[0];

        info.appendChild(name);
        info.appendChild(description);

        const stock = Number(product.stock ?? 0);

        if (stock <= 0) {

            const soldOut = document.createElement("div");
            soldOut.className = "soldOut";
            soldOut.textContent = "ESGOTADO";

            info.appendChild(soldOut);

        } else {

            const price = document.createElement("div");
            price.className = "price";

            price.textContent =
                Number(product.price || 0).toLocaleString("pt-PT") +
                " Kz";

            info.appendChild(price);

        }

        card.appendChild(image);
        card.appendChild(info);

        card.addEventListener("click", function () {
            openProduct(product.id);
        });

        productsDiv.appendChild(card);

    });

}

/* =====================================
   BLOC 4 — FILTRAR LES PRODUITS
===================================== */

function filterProducts(value) {

    const searchValue = normalizeText(value);

    if (!searchValue) {

        renderProducts(allProducts);

        searchStatus.textContent =
            allProducts.length +
            " produtos disponíveis";

        return;
    }

    const filtered = allProducts.filter(product => {

        const name = normalizeText(product.name);
        const description = normalizeText(product.description);
        const province = normalizeText(product.province);
        const category = normalizeText(product.category);

        return (
            name.includes(searchValue) ||
            description.includes(searchValue) ||
            province.includes(searchValue) ||
            category.includes(searchValue)
        );

    });

    renderProducts(filtered);

    searchStatus.textContent =
        filtered.length +
        (
            filtered.length === 1
                ? " produto encontrado"
                : " produtos encontrados"
        );

}

/* =====================================
   BLOC 5 — RECHERCHE EN TEMPS RÉEL
===================================== */

searchInput.addEventListener("input", function () {

    filterProducts(this.value);

});

/* =====================================
   BLOC 6 — OUVRIR UN PRODUIT
===================================== */

function openProduct(id) {

    const product = allProducts.find(
        item => item.id === id
    );

    if (!product) {
        alert("Produto não encontrado.");
        return;
    }

    if (Number(product.stock ?? 0) <= 0) {

        alert("Produto esgotado.");
        return;

    }

    localStorage.setItem(
        "selectedProduct",
        id
    );

    window.location.href =
        "./product.html?id=" + encodeURIComponent(id);

}

/* =====================================
   BLOC 7 — BOUTON RETOUR
===================================== */

backButton.addEventListener("click", function () {

    if (window.history.length > 1) {
        window.history.back();
    } else {
        window.location.href = "./homes-v3.html";
    }

});

/* =====================================
   BLOC 8 — DÉMARRAGE
===================================== */

loadProducts();

</script>

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", function () {

        navigator.serviceWorker.register("/service-worker.js")
            .catch(function (error) {
                console.error(
                    "[TOMA SEARCH] Service Worker :",
                    error
                );
            });

    });

}

</script>

</body>
</html>
