 <!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Toma • Produtos</title>
<link
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
rel="stylesheet">
<link
rel="stylesheet"
href="products.css">

</head>

<body>

<!-- Header -->
<header id="productsHeader">

<div class="topBar">

<button
id="backButton"
class="iconButton">

←

</button>

<div class="pageTitle">

Produtos

</div>

<button
id="cartButton"
class="cartButtonHeader">

<span class="material-symbols-rounded cartIcon">

shopping_cart

</span>

<span
id="cartCount"
class="cartBadge">

0

</span>

<span
id="cartPulse"
class="cartPulse">

</span>

</button>
</div>

<div class="searchBox">

<span>

🔍

</span>

<input
id="searchInput"
type="text"
placeholder="Pesquisar produtos...">

</div>

</header>
<!-- Barre de recherche -->
<section id="searchSection"></section>

<!-- Filtres -->
<section id="filtersSection">

<div class="filterChip active" data-filter="all">

Todos

</div>

<div class="filterChip" data-filter="promo">
 Promoções

</div>

<div class="filterChip" data-filter="new">

Novidades

</div>

<div class="filterChip" data-filter="top">

 Mais vendidos

</div>

<div class="filterChip" data-filter="cheap">

 Menor preço

</div>

<div class="filterChip" data-filter="expensive">

 Maior preço

</div>

</section>
<!-- Informations catalogue -->
<section id="catalogInfo"></section>

<!-- Produits -->
<main id="productsGrid">

<!-- Les produits seront chargés automatiquement ici -->

</main>
<!-- Loader -->
<!-- Loader Premium -->
<div id="loader" class="loaderScreen">

    <div class="loaderContent">

        <div class="loaderCircle"></div>

        <div class="loaderText">

            Carregando produtos...

        </div>

    </div>

</div>
<script>

document.querySelectorAll(".filterChip").forEach(chip=>{

chip.onclick=()=>{

document.querySelectorAll(".filterChip")

.forEach(c=>c.classList.remove("active"));

chip.classList.add("active");

};

});

</script>
<script type="module" src="./js/products-page.js"></script>
</body>

</html>
