 <!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produto</title>

<link rel="stylesheet" href="product-detail.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">

</head>

<body>

</body>

</html>
<!-- ===================================== -->
<!-- HEADER -->
<!-- ===================================== -->

<header class="productHeader">

    <button id="backButton" class="headerButton">

        <span class="material-symbols-rounded">
            arrow_back
        </span>

    </button>

    <h1>
        Produto
    </h1>

    <button id="cartButton" class="headerButton">

        <span class="material-symbols-rounded">
            shopping_cart
        </span>

        <span id="cartBadge" class="cartBadge">

            0

        </span>

    </button>

</header>
<!-- ===================================== -->
<!-- GALERIE -->
<!-- ===================================== -->

<section class="galleryCard">

    <div id="imageSlider" class="imageSlider">

        <!-- Images -->

    </div>

    <div id="sliderCounter" class="sliderCounter">

        1 / 1

    </div>

    <div id="sliderDots" class="sliderDots">

    </div>

    <div id="galleryThumbs" class="galleryThumbs">

    </div>

</section>
<!-- ===================================== -->
<!-- INFORMATIONS PRODUIT -->
<!-- ===================================== -->

<section class="infoCard">

    <h2 id="productName">
        Carregando...
    </h2>

    <div class="badgeRow">

        <div id="ratingBadge" class="ratingBadge">
            ⭐⭐⭐⭐⭐ 0
        </div>

        <div class="verifiedBadge">
            ✔ Verificado
        </div>

    </div>

    <div id="productPrice" class="productPrice">
        0 Kz
    </div>

    <div id="oldPrice" class="oldPrice"></div>

    <div id="discountBadge" class="discountBadge"></div>

    <div id="stockBadge" class="stockBadge">
        Carregando...
    </div>

    <p id="productDescription" class="productDescription">
    </p>

    <div class="productExtraInfo">

        <div class="extraItem">
            📍
            <span id="productProvince">
                Angola
            </span>
        </div>

        <div class="extraItem">
            👁️
            <span id="productViews">
                0 visualizações
            </span>
        </div>

        <div class="extraItem">
            🛒
            <span id="productSales">
                0 vendas
            </span>
        </div>

    </div>

</section>

<!-- ===================================== -->
<!-- VARIANTES -->
<!-- ===================================== -->

<section id="variantsSection" class="variantsSection">

    <h3>
        Escolha uma opção
    </h3>

    <div id="variantsContainer">

    </div>

</section>

<!-- ===================================== -->
<!-- QUANTIDADE -->
<!-- ===================================== -->

<section class="quantitySection">

    <h3>
        Quantidade
    </h3>

    <div class="quantityBox">

        <button id="minusQty" class="qtyButton">
            −
        </button>

        <div id="quantityValue" class="quantityValue">
            1
        </div>

        <button id="plusQty" class="qtyButton">
            +
        </button>

    </div>

</section>

<!-- ===================================== -->
<!-- ACTIONS -->
<!-- ===================================== -->

<section class="actionButtons">

    <button id="favoriteButton" class="iconButton">
        ❤️
        <span>Favoritos</span>
    </button>

    <button id="shareButton" class="iconButton">
        📤
        <span>Partilhar</span>
    </button>

    <button id="chatButton" class="iconButton">
        💬
        <span>Chat</span>
    </button>

    <button id="buyButton" class="buyButton">
        🛒 Comprar Agora
    </button>

</section>
