 <!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <meta
        name="description"
        content="Relatórios administrativos da plataforma Toma"
    >

    <title>Relatórios — Toma</title>


    <!-- ==========================================
         MATERIAL SYMBOLS
    =========================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap"
        rel="stylesheet"
    >


    <!-- ==========================================
         CSS DA PÁGINA
    =========================================== -->

    <link
        rel="stylesheet"
        href="css/relatorios.css"
    >

</head>


<body>


    <!-- ==========================================
         APP
    =========================================== -->

    <div id="relatoriosApp">


        <!-- ======================================
             HEADER
        ======================================= -->

        <header
            id="reportsHeader"
            class="reportsHeader"
        >

            <div class="reportsHeaderInner">


                <!-- VOLTAR -->

                <div class="reportsHeaderLeft">

                    <button
                        id="backReportsButton"
                        class="backReportsButton"
                        type="button"
                        aria-label="Voltar"
                    >

                        <span class="material-symbols-rounded">
                            arrow_back
                        </span>

                    </button>


                    <!-- TÍTULO -->

                    <div class="reportsTitleBlock">

                        <h1 class="reportsTitle">
                            Relatórios
                        </h1>

                        <p class="reportsSubtitle">
                            Análise e desempenho da plataforma Toma
                        </p>

                    </div>

                </div>


                <!-- AÇÕES -->

                <div class="reportsHeaderActions">

                    <button
                        id="exportReportsButton"
                        class="headerActionButton"
                        type="button"
                    >

                        <span class="material-symbols-rounded">
                            download
                        </span>

                        <span class="headerActionText">
                            Exportar
                        </span>

                    </button>

                </div>


            </div>

        </header>



        <!-- ======================================
             CONTEÚDO PRINCIPAL
        ======================================= -->

        <main
            id="reportsMain"
            class="reportsMain"
        >


            <!-- INTRODUÇÃO -->

            <section
                id="reportsIntro"
                class="reportsIntro"
            >

                <h2>
                    Visão geral dos relatórios
                </h2>

                <p>
                    Consulte o desempenho da plataforma,
                    vendas, comerciantes, produtos e finanças.
                </p>

            </section>



            <!-- ==================================
                 FILTRO DE PERÍODO
            =================================== -->

            <section
                id="reportsPeriodBar"
                class="reportsPeriodBar"
            >

                <div class="reportsPeriodInfo">

                    <div class="reportsPeriodIcon">

                        <span class="material-symbols-rounded">
                            calendar_month
                        </span>

                    </div>


                    <div class="reportsPeriodText">

                        <strong>
                            Período do relatório
                        </strong>

                        <span id="reportsPeriodLabel">
                            Últimos 30 dias
                        </span>

                    </div>

                </div>


                <div class="reportsPeriodControls">

                    <select
                        id="reportsPeriodSelect"
                        class="reportsPeriodSelect"
                        aria-label="Selecionar período"
                    >

                        <option value="today">
                            Hoje
                        </option>

                        <option value="7days">
                            Últimos 7 dias
                        </option>

                        <option
                            value="30days"
                            selected
                        >
                            Últimos 30 dias
                        </option>

                        <option value="year">
                            Este ano
                        </option>

                        <option value="custom">
                            Período personalizado
                        </option>

                    </select>


                    <button
                        id="refreshReportsButton"
                        class="reportsRefreshButton"
                        type="button"
                        aria-label="Atualizar relatórios"
                    >

                        <span class="material-symbols-rounded">
                            refresh
                        </span>

                    </button>

                </div>

            </section>



            <!-- ==================================
                 CONTEÚDO DOS RELATÓRIOS
            =================================== -->

            <section
                id="reportsContent"
                class="reportsContent"
            >

                <!--
                    Os blocos de relatórios
                    serão adicionados aqui
                    progressivamente.
                -->

            </section>


        </main>


    </div>



    <!-- ==========================================
         JAVASCRIPT DA PÁGINA
    =========================================== -->

    <script
        type="module"
        src="js/relatorios.js"
    ></script>


</body>

</html>
