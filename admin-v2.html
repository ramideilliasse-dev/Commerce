 <!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <title>TOMA Admin — Dashboard</title>

    <!--
        CSS
        Nous créerons admin-v2.css après avoir terminé le HTML.
    -->
    <link
        rel="stylesheet"
        href="admin-v2.css"
    >

</head>


<body>


<!-- ==================================================
     TOMA ADMIN V2
     APPLICATION PRINCIPALE
================================================== -->

<div id="adminApp">


    <!-- ==================================================
         SIDEBAR
    ================================================== -->

    <aside
        id="adminSidebar"
        class="adminSidebar"
    >


        <!-- ==============================================
             LOGO
        ============================================== -->

        <div
            id="adminBrand"
            class="adminBrand"
        >

            <div class="brandLogo">
                TOMA
            </div>

            <div class="brandSubtitle">
                ADMIN
            </div>

        </div>


        <!-- ==============================================
             NAVIGATION PRINCIPALE
        ============================================== -->

        <nav
            id="dashboardNavigation"
            class="dashboardNavigation"
        >


            <!-- DASHBOARD -->

            <a
                id="navDashboard"
                class="navItem active"
                href="admin-v2.html"
            >

                <span class="navIcon">📊</span>

                <span class="navText">
                    Dashboard
                </span>

            </a>


            <!-- UTILISATEURS -->

            <a
                id="navUsers"
                class="navItem"
                href="utilisateurs.html"
            >

                <span class="navIcon">👥</span>

                <span class="navText">
                    Utilizadores
                </span>

            </a>


            <!-- COMMERÇANTS -->

            <a
                id="navMerchants"
                class="navItem"
                href="merchants.html"
            >

                <span class="navIcon">🏪</span>

                <span class="navText">
                    Comerciantes
                </span>

            </a>


            <!-- PRODUITS -->

            <a
                id="navProducts"
                class="navItem"
                href="products.html"
            >

                <span class="navIcon">📦</span>

                <span class="navText">
                    Produtos
                </span>

            </a>


            <!-- COMMANDES -->

            <a
                id="navOrders"
                class="navItem"
                href="orders.html"
            >

                <span class="navIcon">🛒</span>

                <span class="navText">
                    Pedidos
                </span>

            </a>


            <!-- FINANCES -->

            <a
                id="navFinances"
                class="navItem"
                href="finances.html"
            >

                <span class="navIcon">💰</span>

                <span class="navText">
                    Finanças
                </span>

            </a>


            <!-- NOTIFICATIONS -->

            <a
                id="navNotifications"
                class="navItem"
                href="notifications.html"
            >

                <span class="navIcon">🔔</span>

                <span class="navText">
                    Notificações
                </span>

                <span
                    id="notificationsBadge"
                    class="navBadge"
                >
                    0
                </span>

            </a>


            <!-- RAPPORTS -->

            <a
                id="navReports"
                class="navItem"
                href="reports.html"
            >

                <span class="navIcon">📈</span>

                <span class="navText">
                    Relatórios
                </span>

            </a>


            <!-- BOUTIQUES OFFICIELLES -->

            <a
                id="navOfficialStores"
                class="navItem"
                href="official-stores.html"
            >

                <span class="navIcon">🏬</span>

                <span class="navText">
                    Lojas oficiais
                </span>

            </a>


            <!-- PARAMÈTRES -->

            <a
                id="navSettings"
                class="navItem"
                href="settings.html"
            >

                <span class="navIcon">⚙️</span>

                <span class="navText">
                    Configurações
                </span>

            </a>


        </nav>


        <!-- ==============================================
             PROFIL ADMIN
        ============================================== -->

        <div
            id="adminProfile"
            class="adminProfile"
        >

            <img
                id="adminAvatar"
                class="adminAvatar"
                src="images/avatar.png"
                alt="Administrador"
            >

            <div class="adminProfileInfo">

                <strong id="adminName">
                    Administrador
                </strong>

                <span>
                    Super Admin
                </span>

            </div>

            <button
                id="logoutButton"
                type="button"
                class="logoutButton"
            >
                Sair
            </button>

        </div>


    </aside>



    <!-- ==================================================
         CONTENU PRINCIPAL
    ================================================== -->

    <main
        id="adminMain"
        class="adminMain"
    >


        <!-- ==============================================
             HEADER
        ============================================== -->

        <header
            id="adminHeader"
            class="adminHeader"
        >


            <div class="headerWelcome">

                <h1 id="dashboardTitle">
                    Dashboard
                </h1>

                <p id="dashboardSubtitle">
                    Resumo geral da plataforma TOMA
                </p>

            </div>


            <div class="headerActions">


                <!-- RECHERCHE -->

                <input
                    id="globalSearch"
                    type="search"
                    placeholder="Pesquisar..."
                    autocomplete="off"
                >


                <!-- NOTIFICATIONS -->

                <button
                    id="notificationsButton"
                    type="button"
                    class="headerButton"
                    aria-label="Notificações"
                >

                    🔔

                </button>


                <!-- RAFRAÎCHIR -->

                <button
                    id="refreshDashboard"
                    type="button"
                    class="headerButton"
                    aria-label="Atualizar dashboard"
                >

                    ↻

                </button>


            </div>


        </header>



        <!-- ==============================================
             CONTENU DU DASHBOARD
        ============================================== -->

        <section
            id="dashboardContent"
            class="dashboardContent"
        >


            <!-- ==========================================
                 CARTES STATISTIQUES
            ========================================== -->

            <section
                id="statisticsCards"
                class="statisticsCards"
            >


                <!-- UTILISATEURS -->

                <article
                    id="usersCard"
                    class="statCard"
                >

                    <div class="statCardHeader">

                        <span>
                            Utilizadores
                        </span>

                        <span class="statIcon">
                            👥
                        </span>

                    </div>

                    <strong id="usersCount">
                        0
                    </strong>

                    <span
                        id="usersGrowth"
                        class="statGrowth"
                    >
                        +0%
                    </span>

                </article>



                <!-- COMMERÇANTS -->

                <article
                    id="merchantsCard"
                    class="statCard"
                >

                    <div class="statCardHeader">

                        <span>
                            Comerciantes
                        </span>

                        <span class="statIcon">
                            🏪
                        </span>

                    </div>

                    <strong id="merchantsCount">
                        0
                    </strong>

                    <span
                        id="merchantsGrowth"
                        class="statGrowth"
                    >
                        +0%
                    </span>

                </article>



                <!-- PRODUITS -->

                <article
                    id="productsCard"
                    class="statCard"
                >

                    <div class="statCardHeader">

                        <span>
                            Produtos
                        </span>

                        <span class="statIcon">
                            📦
                        </span>

                    </div>

                    <strong id="productsCount">
                        0
                    </strong>

                </article>



                <!-- VENTES -->

                <article
                    id="salesCard"
                    class="statCard"
                >

                    <div class="statCardHeader">

                        <span>
                            Vendas
                        </span>

                        <span class="statIcon">
                            💰
                        </span>

                    </div>

                    <strong id="salesCount">
                        0 Kz
                    </strong>

                </article>


            </section>



            <!-- ==================================================
                 SUITE DU DASHBOARD
                 BLOC HTML 2
            ================================================== -->
