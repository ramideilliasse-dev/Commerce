 <!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Toma Admin</title>

<link rel="stylesheet" href="admin-v2.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">

</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <h2>TOMA 👑</h2>

            <span>ADMIN</span>

        </div>

        <nav>

            <button class="menu active">

🏠 Dashboard

</button>

            <button class="menu">

🏪 Lojas Oficiais

</button>

            <button class="menu">

👥 Utilizadores

</button>

            <button class="menu">

🛍 Comerciantes

</button>

            <button class="menu">

📦 Produtos

</button>

            <button class="menu">

📋 Pedidos

</button>

            <button class="menu">

🖼 Banner

</button>

            <button class="menu">

📈 Estatísticas

</button>

            <button class="menu">

⚙ Configurações

</button>

        </nav>

        <div class="adminBox">

            <img src="images/default-avatar.png">

            <div>

                <strong>Ramide</strong>

                <small>Super Admin</small>

            </div>

        </div>

    </aside>

    <!-- CONTENU -->

    <main class="content">

        <!-- Header -->

        <header class="topBar">

            <div>

                <h1>

Bom dia, Ramide! 👋

</h1>

                <p>

Bem-vindo ao painel administrativo da Toma.

</p>

            </div>

            <div class="topActions">

                <button>

🔔

</button>

                <button>

＋

</button>

            </div>

        </header>

        <!-- Les cartes seront ajoutées au Bloc 2 -->

        <section id="dashboardCards">

    <div class="statCard">

        <div>

            <span class="cardTitle">

                UTILIZADORES

            </span>

            <h2 id="usersCount">

                0

            </h2>

            <small class="positive">

                +0%

            </small>

        </div>

        <div class="cardIcon blue">

            👥

        </div>

    </div>

    <div class="statCard">

        <div>

            <span class="cardTitle">

                COMERCIANTES

            </span>

            <h2 id="merchantsCount">

                0

            </h2>

            <small class="positive">

                +0%

            </small>

        </div>

        <div class="cardIcon green">

            🏪

        </div>

    </div>

    <div class="statCard">

        <div>

            <span class="cardTitle">

                PRODUTOS

            </span>

            <h2 id="productsCount">

                0

            </h2>

            <small class="positive">

                +0%

            </small>

        </div>

        <div class="cardIcon orange">

            📦

        </div>

    </div>

    <div class="statCard">

        <div>

            <span class="cardTitle">

                VENDAS (KZ)

            </span>

            <h2 id="salesCount">

                0

            </h2>

            <small class="positive">

                +0%

            </small>

        </div>

        <div class="cardIcon money">

            💰

        </div>

    </div>

</section>
     <section class="chartsSection">

    <div class="chartCard">

        <div class="chartHeader">

            <h3>Vendas</h3>

            <span>Últimos 7 dias</span>

        </div>

        <canvas id="salesChart"></canvas>

    </div>

    <div class="chartCard">

        <div class="chartHeader">

            <h3>Pedidos</h3>

            <span>Hoje</span>

        </div>

        <canvas id="ordersChart"></canvas>

    </div>

</section>
    </main>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="js/admin-v2.js"></script>

</body>

</html>
