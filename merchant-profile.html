 <!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Perfil do Comerciante</title>

<link rel="stylesheet"
href="merchant-profile.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
rel="stylesheet">

</head>

<body>

<header class="pageHeader">

<button id="backButton" class="headerButton">

<span class="material-symbols-rounded">

arrow_back

</span>

</button>

<div class="headerTitle">

<h1>

Perfil do Comerciante

</h1>

<p>

Painel Administrativo

</p>

</div>

<button id="refreshButton" class="headerButton">

<span class="material-symbols-rounded">

refresh

</span>

</button>

</header>

<!--==============================-->
<!-- HERO -->
<!--==============================-->

<section class="merchantHero">

<img
id="merchantPhoto"
class="merchantPhoto"
src="images/avatar.png">

<div class="merchantHeroInfo">

<h2 id="merchantName">

Nome Completo

</h2>

<p id="merchantShop">

Loja

</p>

<span
id="merchantStatus"
class="statusBadge">

Aprovado

</span>

</div>

</section>

<!--==============================-->
<!-- STATISTIQUES -->
<!--==============================-->

<section class="statsGrid">

<div class="statCard">

<h2 id="productsCount">

0

</h2>

<p>

Produtos

</p>

</div>

<div class="statCard">

<h2 id="ordersCount">

0

</h2>

<p>

Pedidos

</p>

</div>

<div class="statCard">

<h2 id="salesCount">

0 Kz

</h2>

<p>

Vendas

</p>

</div>

<div class="statCard">

<h2 id="ratingCount">

0

</h2>

<p>

Avaliação

</p>

</div>

</section>

<!--==============================-->
<!-- MENU -->
<!--==============================-->

<section class="actionGrid">

<button id="seeProducts">

📦 Produtos

</button>

<button id="seeOrders">

🛒 Pedidos

</button>

<button id="contactMerchant">

💬 Contactar

</button>

<button id="officialStore">

🏪 Loja Oficial

</button>

</section>
<!--==============================-->
<!-- INFORMATIONS -->
<!--==============================-->

<section class="infoSection">

<div class="infoCard">

<h2>Informações do Comerciante</h2>

<div class="infoGrid">

<div class="infoItem">

<label>📞 Telefone</label>

<p id="merchantPhone">-</p>

</div>

<div class="infoItem">

<label>📧 Email</label>

<p id="merchantEmail">-</p>

</div>

<div class="infoItem">

<label>📍 Província</label>

<p id="merchantProvince">-</p>

</div>

<div class="infoItem">

<label>🏙 Cidade</label>

<p id="merchantCity">-</p>

</div>

<div class="infoItem">

<label>🏠 Endereço</label>

<p id="merchantAddress">-</p>

</div>

<div class="infoItem">

<label>🏪 Loja Oficial</label>

<p id="merchantOfficialStore">Nenhuma</p>

</div>

<div class="infoItem">

<label>📅 Data de Registo</label>

<p id="merchantCreatedAt">-</p>

</div>

<div class="infoItem">

<label>🆔 ID do Comerciante</label>

<p id="merchantId">-</p>

</div>

</div>

</div>

</section>

<!--==============================-->
<!-- DOCUMENTOS -->
<!--==============================-->

<section class="documentsSection">

<div class="documentsCard">

<h2>Documentos</h2>

<div class="documentsGrid">

<div class="documentItem">

<img
id="merchantIdDocument"
src="images/document.png"
alt="Bilhete de Identidade">

<h3>Bilhete de Identidade</h3>

<button id="openIdDocument">

Ver Documento

</button>

</div>

<div class="documentItem">

<img
id="merchantBusinessLicense"
src="images/document.png"
alt="Alvará Comercial">

<h3>Alvará Comercial</h3>

<button id="openBusinessLicense">

Ver Documento

</button>

</div>

</div>

</div>

</section>

<!--==============================-->
<!-- ADMIN ACTIONS -->
<!--==============================-->

<section class="adminActions">

<button id="approveMerchantButton"
class="greenButton">

✅ Aprovar

</button>

<button id="suspendMerchantButton"
class="orangeButton">

⏸ Suspender

</button>

<button id="changeStoreButton"
class="blueButton">

🏪 Alterar Loja Oficial

</button>

<button id="deleteMerchantButton"
class="redButton">

🗑 Eliminar Comerciante

</button>

</section>
