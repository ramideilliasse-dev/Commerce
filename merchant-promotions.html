 <!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Promoções | TOMA</title>

<link rel="stylesheet" href="merchant-dashboard-v2.css">

<link rel="stylesheet" href="merchant-promotions.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">

</head>

<body>

<div class="productsPage">

<header class="productsHeader">

<div class="leftHeader">

<a href="merchant-dashboard-v2.html" class="backButton">

<span class="material-symbols-rounded">

arrow_back

</span>

</a>

<div>

<h1>

Promoções

</h1>

<p>

Crie e gerencie promoções da sua loja.

</p>

</div>

</div>

</header>

<!-- ===========================
RESUMO
=========================== -->

<section class="promotionSummary">

<div class="summaryCard">

<div>

<h2>

🔥 Promoções Ativas

</h2>

<p>

Gerencie descontos dos seus produtos.

</p>

</div>

<button id="newPromotionBtn">

<span class="material-symbols-rounded">

add

</span>

Nova Promoção

</button>

</div>

</section>

<!-- ===========================
ESTATÍSTICAS
=========================== -->

<section class="promotionStats">

<div class="promoStat">

<h3 id="activePromotions">

0

</h3>

<span>

Ativas

</span>

</div>

<div class="promoStat">

<h3 id="scheduledPromotions">

0

</h3>

<span>

Agendadas

</span>

</div>

<div class="promoStat">

<h3 id="expiredPromotions">

0

</h3>

<span>

Expiradas

</span>

</div>

</section>

<!-- ===========================
PESQUISA
=========================== -->

<section class="searchSection">

<div class="searchBox">

<span class="material-symbols-rounded">

search

</span>

<input

id="searchPromotion"

type="text"

placeholder="Pesquisar produto...">

</div>

</section>

<!-- ===========================
FILTROS
=========================== -->

<section class="filters">

<button
class="filterChip active"
data-filter="all">

Todos

</button>

<button
class="filterChip"
data-filter="promotion">

Em promoção

</button>

<button
class="filterChip"
data-filter="normal">

Sem promoção

</button>

<button
class="filterChip"
data-filter="expired">

Expiradas

</button>

</section>

<!-- ===========================
PRODUTOS
=========================== -->

<section class="shopProductsSection">

<div

id="promotionGrid"

class="promotionGrid">

</div>

</section>

<!-- ===========================
BOTÃO FLUTUANTE
=========================== -->

<button

id="floatingPromotionBtn"

class="floatingPromotionBtn">

<span class="material-symbols-rounded">

local_offer

</span>

</button>

</div>

<script
type="module"
src="./js/merchant-promotions.js">

</script>

</body>

</html>
