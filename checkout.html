<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Toma">

<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">

<title>Finalizar Pedido</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,sans-serif;

background:#f5f6fb;

color:#222;

padding-bottom:120px;

}

/*=========================
HEADER
=========================*/

.header{

position:fixed;

top:0;

left:0;

right:0;

height:72px;

background:white;

display:flex;

align-items:center;

justify-content:center;

font-size:22px;

font-weight:bold;

box-shadow:0 5px 20px rgba(0,0,0,.08);

z-index:1000;

}

.backBtn{

position:absolute;

left:18px;

font-size:26px;

cursor:pointer;

}

/*=========================
CONTAINER
=========================*/

.container{

max-width:900px;

margin:auto;

padding:90px 15px 30px;

}

/*=========================
CARDS
=========================*/

.card{

background:white;

border-radius:18px;

padding:18px;

margin-bottom:18px;

box-shadow:0 6px 18px rgba(0,0,0,.08);

}

.cardTitle{

font-size:19px;

font-weight:bold;

margin-bottom:18px;

display:flex;

align-items:center;

gap:8px;

}

/*=========================
INPUTS
=========================*/

input,

select,

textarea{

width:100%;

margin-top:12px;

padding:15px;

border-radius:14px;

border:1px solid #ddd;

font-size:16px;

outline:none;

background:white;

transition:.25s;

}

input:focus,

select:focus,

textarea:focus{

border-color:#ff6a00;

box-shadow:0 0 0 3px rgba(255,106,0,.12);

}

textarea{

resize:none;

min-height:90px;

}

/*=========================
PRODUCTOS
=========================*/

.checkoutItem{

display:flex;

gap:12px;

padding:12px 0;

border-bottom:1px solid #eee;

}

.checkoutItem:last-child{

border:none;

}

.checkoutImage{

width:80px;

height:80px;

border-radius:12px;

object-fit:cover;

background:#f2f2f2;

}

.checkoutInfo{

flex:1;

display:flex;

flex-direction:column;

justify-content:center;

}

.checkoutName{

font-size:15px;

font-weight:bold;

margin-bottom:6px;

}

.checkoutQty{

font-size:14px;

color:#666;

}

.checkoutSubtotal{

margin-top:8px;

font-size:16px;

font-weight:bold;

color:#16a34a;

}

/*=========================
TOTAL
=========================*/

.totalBox{

display:flex;

justify-content:space-between;

align-items:center;

margin-top:18px;

padding-top:15px;

border-top:2px dashed #ddd;

font-size:20px;

font-weight:bold;

}

/*=========================
BOTÃO
=========================*/

.confirmBtn{

width:100%;

height:58px;

border:none;

border-radius:18px;

background:linear-gradient(135deg,#16a34a,#1ec95b);

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.25s;

}

.confirmBtn:active{

transform:scale(.98);

}

/*=========================
LOADER
=========================*/

#loaderOverlay{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.65);

display:none;

justify-content:center;

align-items:center;

flex-direction:column;

z-index:99999;

color:white;

}

.loader{

width:60px;

height:60px;

border-radius:50%;

border:6px solid rgba(255,255,255,.25);

border-top:6px solid white;

animation:spin 1s linear infinite;

margin-bottom:18px;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

/*=========================
RESPONSIVE
=========================*/

@media(max-width:600px){

.container{

padding:85px 12px 20px;

}

.card{

padding:15px;

}

.checkoutImage{

width:70px;

height:70px;

}

}

</style>

</head>

<body>

Finalizar Pedido

        <option>Uíge</option>

<button

<!-- =========================
LOADER
========================= -->

<div id="loaderOverlay">

TOAST
========================= -->

<!-- =========================================================
     TOMA — CHECKOUT
     BLOC 13 — CONNEXION DES PAIEMENTS AUX SETTINGS
========================================================= -->

<script type="module">

import { db } from "./firebase.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


/* =========================================================
   BLOC 13.1 — INITIALISATION
========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    initializeCheckoutPaymentSettings();

});


/* =========================================================
   BLOC 13.2 — LECTURE DES SETTINGS
========================================================= */

async function initializeCheckoutPaymentSettings() {

    try {

        alert(
            "CHECKOUT — BLOC 13.1\n\n" +
            "Connexion aux paramètres de paiement de Toma..."
        );


        const paymentSettingsRef =
            doc(
                db,
                "settings",
                "marketplace"
            );


        const paymentSettingsSnapshot =
            await getDoc(
                paymentSettingsRef
            );


        if (!paymentSettingsSnapshot.exists()) {

            throw new Error(
                "Le document settings/marketplace est introuvable."
            );

        }


        const settingsData =
            paymentSettingsSnapshot.data();


        const cashOnDeliveryEnabled =
            settingsData.cashOnDeliveryEnabled === true;


        const onlinePaymentEnabled =
            settingsData.onlinePaymentEnabled === true;


        applyCheckoutPaymentSettings(
            cashOnDeliveryEnabled,
            onlinePaymentEnabled
        );


    }

    catch (error) {

        console.error(
            "Erreur BLOC 13 :",
            error
        );


        alert(
            "CHECKOUT — BLOC 13 ERREUR ❌\n\n" +
            "Impossible de récupérer les paramètres de paiement.\n\n" +
            "Erreur : " +
            error.message
        );

    }

}


/* =========================================================
   BLOC 13.3 — APPLICATION DES SETTINGS
========================================================= */

function applyCheckoutPaymentSettings(
    cashOnDeliveryEnabled,
    onlinePaymentEnabled
) {

    const paymentMethod =
        document.getElementById(
            "paymentMethod"
        );


    if (!paymentMethod) {

        throw new Error(
            "L'ID HTML paymentMethod est introuvable."
        );

    }


    /* =====================================================
       PAIEMENT À LA LIVRAISON
    ===================================================== */

    const cashOption =
        paymentMethod.querySelector(
            'option[value="cash"]'
        );


    if (cashOption) {

        cashOption.hidden =
            !cashOnDeliveryEnabled;

        cashOption.disabled =
            !cashOnDeliveryEnabled;

    }


    /* =====================================================
       PAIEMENTS EN LIGNE
    ===================================================== */

    const transferOption =
        paymentMethod.querySelector(
            'option[value="transfer"]'
        );


    const expressOption =
        paymentMethod.querySelector(
            'option[value="express"]'
        );


    if (transferOption) {

        transferOption.hidden =
            !onlinePaymentEnabled;

        transferOption.disabled =
            !onlinePaymentEnabled;

    }


    if (expressOption) {

        expressOption.hidden =
            !onlinePaymentEnabled;

        expressOption.disabled =
            !onlinePaymentEnabled;

    }


    /* =====================================================
       VÉRIFICATION DU MOYEN ACTUELLEMENT SÉLECTIONNÉ
    ===================================================== */

    if (
        paymentMethod.value === "cash" &&
        !cashOnDeliveryEnabled
    ) {

        paymentMethod.value = "";

    }


    if (
        (
            paymentMethod.value === "transfer" ||
            paymentMethod.value === "express"
        ) &&
        !onlinePaymentEnabled
    ) {

        paymentMethod.value = "";

    }


    /* =====================================================
       BLOC 13 TERMINÉ
    ===================================================== */

    alert(
        "CHECKOUT — BLOC 13 TERMINÉ ✅\n\n" +

        "Connexion des paiements réussie.\n\n" +

        "Pagamento na Entrega : " +
        (
            cashOnDeliveryEnabled
                ? "ATIVADO"
                : "DESATIVADO"
        ) +
        "\n\n" +

        "Pagamento Online : " +
        (
            onlinePaymentEnabled
                ? "ATIVADO"
                : "DESATIVADO"
        ) +
        "\n\n" +

        "Source : settings/marketplace\n\n" +

        "Aucun nouvel ID HTML créé.\n" +
        "Aucune donnée Firestore modifiée."
    );

}

</script>
