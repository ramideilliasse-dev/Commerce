 <!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cupons | Toma</title>

<link rel="stylesheet" href="merchant-dashboard-v2.css">

<link rel="stylesheet" href="merchant-coupons.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">

</head>

<body>

<div class="productsPage">

<header class="productsHeader">

<div class="leftHeader">

<a href="merchant-dashboard-v2.html" class="backButton">

<span class="material-symbols-rounded">
arrow_back
</span>

</a>

<div>

<h1>Cupons</h1>

<p>Crie promoções para aumentar as vendas.</p>

</div>

</div>

<button id="newCouponBtn" class="addProductBtn" type="button">

<span class="material-symbols-rounded">
add
</span>

Novo Cupom

</button>

</header>


<!-- =====================================
FORMULÁRIO DE CUPOM
===================================== -->

<section class="couponForm">

<div class="couponField">

<label for="couponCode">
Código do cupom
</label>

<input
type="text"
id="couponCode"
placeholder="Ex: TOMA10"
maxlength="30"
autocomplete="off">

</div>


<div class="couponField">

<label for="couponDiscount">
Desconto (%)
</label>

<input
type="number"
id="couponDiscount"
placeholder="Ex: 10"
min="1"
max="100"
step="1">

</div>


<div class="couponField expirationField">

<label for="couponExpiration">
Data limite
</label>

<span class="expirationHelp">
Data limite de utilização do cupom
</span>

<input
type="date"
id="couponExpiration">

</div>


<button id="saveCouponBtn" type="button">

<span class="material-symbols-rounded">
local_offer
</span>

Guardar Cupom

</button>

</section>


<!-- =====================================
LISTA DE CUPONS
===================================== -->

<section
id="couponList"
class="couponList">

<div class="emptyCard">

<span class="material-symbols-rounded">
sell
</span>

<h2>
Nenhum cupom
</h2>

<p>
Os seus cupons aparecerão aqui.
</p>

</div>

</section>

</div>


<script
type="module"
src="./js/merchant-coupons.js">
</script>

</body>

</html>
