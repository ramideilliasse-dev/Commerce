 <!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <meta name="apple-mobile-web-app-title"
          content="Toma">

    <link rel="apple-touch-icon"
          href="/icon-192.png">

    <link rel="manifest"
          href="/manifest.json">

    <meta name="theme-color"
          content="#ff6a00">

    <title>Configurações — Toma</title>

    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
        rel="stylesheet"
    >

    <!-- CSS principal -->
    <link
        rel="stylesheet"
        href="dashboard-settings.css"
    >

</head>


<body>


    <!-- =====================================================
         TOMA — DASHBOARD SETTINGS
         BLOC 2 — EN-TÊTE
         ===================================================== -->


    <header id="dashboardSettingsHeader">

        <!-- Bouton Retour -->

        <button
            id="dashboardSettingsBackButton"
            type="button"
            aria-label="Voltar"
        >

            <span class="material-symbols-rounded">
                arrow_back
            </span>

        </button>


        <!-- Informations de la page -->

        <div id="dashboardSettingsHeaderInfo">

            <div id="dashboardSettingsIcon">

                <span class="material-symbols-rounded">
                    settings
                </span>

            </div>


            <div id="dashboardSettingsTitles">

                <h1 id="dashboardSettingsTitle">
                    Configurações
                </h1>

                <p id="dashboardSettingsSubtitle">
                    Gerencie as configurações principais do Toma.
                </p>

            </div>

        </div>

    </header>


    <!-- =====================================================
         CONTENU PRINCIPAL
         Les prochains blocs seront ajoutés ici.
         ===================================================== -->

    <main id="dashboardSettingsMain">

    </main>


    <!-- =====================================================
         JAVASCRIPT PRINCIPAL
         ===================================================== -->

    <script
        type="module"
        src="js/dashboard-settings.js">
    </script>


</body>

</html>
