 <!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">

    <title>Mensagens | Toma</title>

    <link rel="stylesheet" href="merchant-dashboard-v2.css">
    <link rel="stylesheet" href="merchant-chat.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
        rel="stylesheet">
</head>

<body>

    <main class="chatPage">

        <!-- =========================================
             CABEÇALHO DA CONVERSA
        ========================================== -->

        <header class="chatHeader">

            <div class="chatHeaderLeft">

                <a
                    href="merchant-messages.html"
                    class="backButton"
                    aria-label="Voltar às mensagens">

                    <span class="material-symbols-rounded">
                        arrow_back
                    </span>

                </a>

                <img
                    id="customerPhoto"
                    class="customerAvatar"
                    src="images/default-avatar.png"
                    alt="Foto do cliente"
                    loading="eager">

                <div class="chatHeaderInfo">

                    <h2 id="customerName">
                        Cliente
                    </h2>

                    <p id="productName">
                        Produto
                    </p>

                </div>

            </div>

        </header>


        <!-- =========================================
             MENSAGENS DA CONVERSA
        ========================================== -->

        <section
            id="messagesContainer"
            class="messagesContainer"
            aria-label="Mensagens da conversa"
            aria-live="polite">

            <div class="emptyMessages">

                <span class="material-symbols-rounded">
                    chat
                </span>

                <h3>
                    Nenhuma mensagem
                </h3>

                <p>
                    As mensagens desta conversa aparecerão aqui.
                </p>

            </div>

        </section>


        <!-- =========================================
             ERROS DA CONVERSA
             O JavaScript pode criar este elemento.
        ========================================== -->

        <div
            id="merchantChatError"
            role="alert"
            aria-live="assertive"
            hidden>
        </div>


        <!-- =========================================
             CAMPO DE ESCRITA
        ========================================== -->

        <footer class="chatFooter">

            <button
                id="sendImage"
                class="iconButton"
                type="button"
                aria-label="Enviar imagem"
                title="Enviar imagem">

                <span class="material-symbols-rounded">
                    image
                </span>

            </button>


            <textarea
                id="messageInput"
                rows="1"
                maxlength="3000"
                placeholder="Escreva uma mensagem..."
                aria-label="Escreva uma mensagem"></textarea>


            <button
                id="sendMessage"
                class="sendButton"
                type="button"
                aria-label="Enviar mensagem"
                title="Enviar mensagem">

                <span class="material-symbols-rounded">
                    send
                </span>

            </button>

        </footer>

    </main>


    <!-- JAVASCRIPT DO CHAT -->

    <script type="module" src="./js/merchant-chat.js"></script>

</body>

</html>
