 <!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Detalhes do Pedido | Toma</title>

<link
rel="stylesheet"
href="merchant-dashboard-v2.css"
>

<link
rel="stylesheet"
href="merchant-order-details.css"
>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet"
>

<link
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
rel="stylesheet"
>

</head>


<body>

<div class="productsPage">

<header class="productsHeader orderDetailsHeader">

    <div class="leftHeader">

        <a
        href="merchant-orders.html"
        class="backButton"
        aria-label="Voltar"
        >

            <span class="material-symbols-rounded">
                arrow_back
            </span>

        </a>

        <div>

            <h1>Detalhes do Pedido</h1>

            <p>
                Informações completas do pedido.
            </p>

        </div>

    </div>

</header>


<main id="orderDetails">

    <div class="orderLoadingCard">

        <div class="loadingIcon">

            <span class="material-symbols-rounded">
                shopping_bag
            </span>

        </div>

        <h2>Carregando pedido...</h2>

        <p>
            Aguarde enquanto carregamos os detalhes.
        </p>

    </div>

</main>

</div>


<script
type="module"
src="./js/merchant-order-details.js"
></script>

</body>

</html>
