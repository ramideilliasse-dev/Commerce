 <!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toma - Teste Cloudinary</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f3f5f9;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }

        h1 {
            text-align: center;
            color: #ff6a00;
        }

        p {
            line-height: 1.5;
            color: #666;
        }

        label {
            display: block;
            margin: 20px 0 10px;
            font-weight: bold;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #ff6a00;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        button:disabled {
            background: #aaa;
        }

        .status {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            background: #eee;
            line-height: 1.6;
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        .success {
            background: #e5f8ec;
            color: #176b35;
        }

        .error {
            background: #ffe8e8;
            color: #a00000;
        }

        .info {
            background: #eaf2ff;
            color: #174b91;
        }

        .warning {
            background: #fff3dc;
            color: #805500;
        }

        a {
            color: #ff6a00;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>TOMA</h1>

    <p>
        Teste independente de envio de imagens
        utilizando a mesma função do add-product.js.
    </p>

    <div id="authStatus" class="status info">
        A verificar a sessão...
    </div>

    <label for="documentFile">
        Selecionar imagem
    </label>

    <input
        type="file"
        id="documentFile"
        accept="image/jpeg,image/png,image/webp"
    >

    <button id="uploadButton" disabled>
        Testar envio
    </button>

    <div id="result" class="status">
        Aguardando...
    </div>

</div>


<script type="module">

// =====================================================
// BLOCO 1 — FIREBASE
// =====================================================

import {
    db,
    auth
} from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
    addDoc,
    collection,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


// =====================================================
// BLOCO 2 — CONFIGURAÇÃO CLOUDINARY
// =====================================================

const CLOUDINARY_CLOUD_NAME = "xnak6z6m";

const CLOUDINARY_URL =
    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;

const CLOUDINARY_PRESET = "Toma-banner";

const FIRESTORE_COLLECTION = "merchantDocumentTests";


// =====================================================
// BLOCO 3 — ELEMENTOS
// =====================================================

const authStatus = document.getElementById("authStatus");

const documentFile = document.getElementById("documentFile");

const uploadButton = document.getElementById("uploadButton");

const result = document.getElementById("result");

let currentUser = null;

let uploading = false;


// =====================================================
// BLOCO 4 — MENSAGENS
// =====================================================

function showMessage(message, type = "info") {

    result.className = "status " + type;

    result.innerHTML = message;

}


// =====================================================
// BLOCO 5 — AUTENTICAÇÃO
// =====================================================

onAuthStateChanged(auth, (user) => {

    currentUser = user || null;

    if (user) {

        authStatus.className = "status success";

        authStatus.textContent =
            "Ligada com sucesso: " +
            (user.email || user.uid);

        uploadButton.disabled = false;

    } else {

        authStatus.className = "status error";

        authStatus.textContent =
            "Não está autenticado. Entre na sua conta Toma.";

        uploadButton.disabled = true;

    }

});


// =====================================================
// BLOCO 6 — COMPRESSÃO
// COPIADO DA LÓGICA DO ADD-PRODUCT.JS
// =====================================================

function compressImage(file) {

    return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onerror = () => {

            reject(
                new Error(
                    "Não foi possível ler a imagem."
                )
            );

        };

        reader.onload = (event) => {

            const img = new Image();

            img.onerror = () => {

                reject(
                    new Error(
                        "Imagem inválida ou incompatível."
                    )
                );

            };

            img.onload = () => {

                try {

                    const canvas = document.createElement("canvas");

                    const context = canvas.getContext("2d");

                    if (!context) {

                        reject(
                            new Error(
                                "Não foi possível preparar a imagem."
                            )
                        );

                        return;

                    }

                    const MAX_WIDTH = 1200;
                    const MAX_HEIGHT = 1200;

                    const scale = Math.min(
                        1,
                        MAX_WIDTH / img.width,
                        MAX_HEIGHT / img.height
                    );

                    canvas.width = Math.max(
                        1,
                        Math.round(img.width * scale)
                    );

                    canvas.height = Math.max(
                        1,
                        Math.round(img.height * scale)
                    );

                    context.drawImage(
                        img,
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );

                    canvas.toBlob(

                        (blob) => {

                            if (!blob) {

                                reject(
                                    new Error(
                                        "Falha ao comprimir a imagem."
                                    )
                                );

                                return;

                            }

                            resolve(blob);

                        },

                        "image/jpeg",

                        0.78

                    );

                } catch (error) {

                    reject(error);

                }

            };

            img.src = event.target.result;

        };

        reader.readAsDataURL(file);

    });

}


// =====================================================
// BLOCO 7 — UPLOAD CLOUDINARY
// MESMA LÓGICA DO ADD-PRODUCT.JS
// =====================================================

async function uploadImage(file) {

    const compressedBlob = await compressImage(file);

    const formData = new FormData();

    formData.append(
        "file",
        compressedBlob,
        "toma-product.jpg"
    );

    formData.append(
        "upload_preset",
        CLOUDINARY_PRESET
    );


    // Diagnóstico da requisição

    const presetPresent = formData.has("upload_preset");

    const filePresent = formData.has("file");

    showMessage(

        "<strong>Diagnóstico antes do envio</strong><br><br>" +

        "Cloud: " + CLOUDINARY_CLOUD_NAME + "<br>" +

        "Endpoint: /image/upload<br>" +

        "Preset: " + CLOUDINARY_PRESET + "<br>" +

        "Preset presente: " + presetPresent + "<br>" +

        "Ficheiro presente: " + filePresent + "<br>" +

        "Nome enviado: toma-product.jpg<br>" +

        "Tamanho original: " +
        (file.size / 1024).toFixed(2) + " KB<br>" +

        "Tamanho comprimido: " +
        (compressedBlob.size / 1024).toFixed(2) + " KB",

        "info"

    );


    const controller = new AbortController();

    const timeoutId = setTimeout(() => {

        controller.abort();

    }, 60000);


    let response;

    try {

        response = await fetch(

            CLOUDINARY_URL,

            {
                method: "POST",
                body: formData,
                signal: controller.signal
            }

        );

    } catch (error) {

        if (error.name === "AbortError") {

            throw new Error(
                "Tempo limite de envio excedido."
            );

        }

        throw new Error(
            "Falha na ligação: " + error.message
        );

    } finally {

        clearTimeout(timeoutId);

    }


    let data;

    try {

        data = await response.json();

    } catch {

        throw new Error(
            "Resposta inválida do Cloudinary."
        );

    }


    // Guardar resposta para diagnóstico

    console.log(
        "TOMA — Resposta Cloudinary:",
        data
    );


    if (!response.ok || !data.secure_url) {

        throw new Error(

            "Cloudinary: " +

            (data.error?.message || "Erro desconhecido") +

            "<br><br>HTTP: " + response.status +

            "<br>Preset enviado: " + CLOUDINARY_PRESET +

            "<br>Preset presente no FormData: " +
            formData.has("upload_preset")

        );

    }


    return data;

}


// =====================================================
// BLOCO 8 — FIRESTORE
// =====================================================

async function saveToFirestore(file, cloudinaryData) {

    if (!currentUser) {

        throw new Error(
            "Utilizador não autenticado."
        );

    }

    const documentData = {

        title: file.name,

        originalFileName: file.name,

        fileSize: file.size,

        mimeType: file.type,

        documentUrl: cloudinaryData.secure_url,

        cloudinaryPublicId: cloudinaryData.public_id,

        resourceType: cloudinaryData.resource_type,

        format: cloudinaryData.format || "",

        uid: currentUser.uid,

        email: currentUser.email || "",

        status: "test_uploaded",

        createdAt: serverTimestamp()

    };

    const reference = await addDoc(

        collection(db, FIRESTORE_COLLECTION),

        documentData

    );

    return reference.id;

}


// =====================================================
// BLOCO 9 — TESTE PRINCIPAL
// =====================================================

uploadButton.addEventListener("click", async () => {

    if (uploading) return;

    const file = documentFile.files[0];

    if (!file) {

        showMessage(
            "Selecione uma imagem primeiro.",
            "warning"
        );

        return;

    }

    if (!currentUser) {

        showMessage(
            "Entre na sua conta Toma antes de continuar.",
            "error"
        );

        return;

    }

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];

    if (!allowedTypes.includes(file.type)) {

        showMessage(
            "Formato não permitido. Utilize JPG, PNG ou WEBP.",
            "error"
        );

        return;

    }

    if (file.size > 15 * 1024 * 1024) {

        showMessage(
            "A imagem ultrapassa 15 MB.",
            "error"
        );

        return;

    }


    uploading = true;

    uploadButton.disabled = true;

    uploadButton.textContent = "A enviar...";


    try {

        // PRIMEIRA ETAPA — CLOUDINARY

        showMessage(
            "A preparar e enviar a imagem...",
            "info"
        );

        const cloudinaryData = await uploadImage(file);


        showMessage(
            "Imagem recebida e guardada no Cloudinary.<br>A guardar no Firestore...",
            "success"
        );


        // SEGUNDA ETAPA — FIRESTORE

        const firestoreId = await saveToFirestore(
            file,
            cloudinaryData
        );


        // RESULTADO

        showMessage(

            "<strong>TESTE CONCLUÍDO COM SUCESSO!</strong><br><br>" +

            "Cloudinary: OK<br>" +

            "Firestore: OK<br><br>" +

            "Coleção: " + FIRESTORE_COLLECTION + "<br>" +

            "ID: " + firestoreId + "<br><br>" +

            "URL da imagem:<br>" +

            `<a href="${cloudinaryData.secure_url}" target="_blank">Abrir imagem</a>`,

            "success"

        );

    } catch (error) {

        console.error(
            "TOMA — Erro de teste:",
            error
        );

        showMessage(

            "<strong>ERRO NO TESTE</strong><br><br>" +

            error.message,

            "error"

        );

    } finally {

        uploading = false;

        uploadButton.disabled = !currentUser;

        uploadButton.textContent = "Testar envio";

    }

});


// =====================================================
// BLOCO 10 — SELEÇÃO DA IMAGEM
// =====================================================

documentFile.addEventListener("change", () => {

    const file = documentFile.files[0];

    if (!file) return;

    showMessage(

        "Imagem selecionada:<br>" +

        "Nome: " + file.name + "<br>" +

        "Tipo: " + file.type + "<br>" +

        "Tamanho: " +
        (file.size / 1024).toFixed(2) + " KB",

        "info"

    );

});

</script>

</body>
</html>
