 <!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste de Documentos - Toma</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #222;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #ff6a00;
        }

        .description {
            text-align: center;
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #ff6a00;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            background: #f1f1f1;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .success {
            background: #e6f8ed;
            color: #176b35;
        }

        .error {
            background: #ffe9e9;
            color: #a40000;
        }

        .warning {
            background: #fff4df;
            color: #805500;
        }

        .info {
            background: #eaf2ff;
            color: #174b91;
        }

        .small {
            margin-top: 15px;
            color: #777;
            font-size: 12px;
            line-height: 1.5;
        }

        a {
            color: #ff6a00;
            word-break: break-all;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>TOMA</h1>

    <p class="description">
        Teste independente de envio de documentos
        para Cloudinary e Firestore.
    </p>

    <div id="authStatus" class="status info">
        A verificar a ligação à conta...
    </div>

    <br>

    <label for="documentFile">
        Selecionar documento
    </label>

    <input
        type="file"
        id="documentFile"
        accept=".jpg,.jpeg,.png,.webp,.pdf"
    >

    <button id="uploadButton" disabled>
        Enviar documento
    </button>

    <div id="result" class="status">
        Aguardando seleção de documento...
    </div>

    <p class="small">
        Este teste utiliza o preset Cloudinary Toma-banner.
        Os dados do documento serão guardados na coleção
        merchantDocumentTests do Firestore.
    </p>

</div>


<script type="module">

// =====================================================
// BLOCO 1 — IMPORTAÇÕES FIREBASE
// =====================================================

import {
    db,
    auth
} from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
    addDoc,
    collection,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


// =====================================================
// BLOCO 2 — CONFIGURAÇÃO CLOUDINARY
// =====================================================

const CLOUDINARY_CLOUD_NAME = "xnak6z6m";

const CLOUDINARY_PRESET = "Toma-banner";

const CLOUDINARY_URL =
    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;

const FIRESTORE_COLLECTION = "merchantDocumentTests";


// =====================================================
// BLOCO 3 — ELEMENTOS HTML
// =====================================================

const authStatus = document.getElementById("authStatus");

const documentFile = document.getElementById("documentFile");

const uploadButton = document.getElementById("uploadButton");

const result = document.getElementById("result");

let currentUser = null;

let uploading = false;


// =====================================================
// BLOCO 4 — MENSAGENS VISÍVEIS
// =====================================================

function showMessage(message, type = "info") {

    result.className = "status " + type;

    result.innerHTML = message;

}


// =====================================================
// BLOCO 5 — VERIFICAR AUTENTICAÇÃO
// =====================================================

onAuthStateChanged(auth, (user) => {

    currentUser = user;

    if (user) {

        authStatus.className = "status success";

        authStatus.innerHTML =
            "Ligada com sucesso.<br>" +
            "Conta: " + (user.email || user.uid);

        uploadButton.disabled = false;

    } else {

        authStatus.className = "status error";

        authStatus.innerHTML =
            "Não está autenticado.<br>" +
            "Entre na sua conta Toma antes de continuar.";

        uploadButton.disabled = true;

    }

});


// =====================================================
// BLOCO 6 — VALIDAR DOCUMENTO
// =====================================================

function validateFile(file) {

    if (!file) {

        throw new Error(
            "Selecione um documento primeiro."
        );

    }

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp",
        "application/pdf"
    ];

    if (!allowedTypes.includes(file.type)) {

        throw new Error(
            "Formato não permitido. Utilize JPG, PNG, WEBP ou PDF."
        );

    }

    const maxSize = 10 * 1024 * 1024;

    if (file.size > maxSize) {

        throw new Error(
            "O documento ultrapassa o limite de 10 MB."
        );

    }

}


// =====================================================
// BLOCO 7 — ENVIAR DOCUMENTO PARA CLOUDINARY
// =====================================================

async function uploadDocument(file) {

    const formData = new FormData();

    // Mesma estrutura do add-product.js

    formData.append(
        "file",
        file,
        file.name
    );

    formData.append(
        "upload_preset",
        CLOUDINARY_PRESET
    );


    // Verificação antes do envio

    if (!formData.has("upload_preset")) {

        throw new Error(
            "O campo upload_preset não foi encontrado."
        );

    }

    if (formData.get("upload_preset") !== CLOUDINARY_PRESET) {

        throw new Error(
            "O preset enviado não corresponde ao preset configurado."
        );

    }


    showMessage(
        "A enviar para Cloudinary...<br>" +
        "Preset: " + CLOUDINARY_PRESET + "<br>" +
        "Ficheiro: " + file.name,
        "info"
    );


    const controller = new AbortController();

    const timeoutId = setTimeout(() => {

        controller.abort();

    }, 60000);


    let response;

    try {

        response = await fetch(
            CLOUDINARY_URL,
            {
                method: "POST",
                body: formData,
                signal: controller.signal
            }
        );

    } catch (error) {

        if (error.name === "AbortError") {

            throw new Error(
                "O envio demorou demasiado tempo. Verifique a ligação e tente novamente."
            );

        }

        throw new Error(
            "Falha na ligação ao Cloudinary: " + error.message
        );

    } finally {

        clearTimeout(timeoutId);

    }


    let data;

    try {

        data = await response.json();

    } catch {

        throw new Error(
            "O Cloudinary devolveu uma resposta inválida."
        );

    }


    if (!response.ok || !data.secure_url) {

        console.error("Resposta Cloudinary:", data);

        const cloudinaryError =
            data.error?.message || "Erro desconhecido.";

        throw new Error(
            "Erro Cloudinary: " + cloudinaryError +
            "<br><br>HTTP: " + response.status
        );

    }


    return data;

}


// =====================================================
// BLOCO 8 — GUARDAR INFORMAÇÕES NO FIRESTORE
// =====================================================

async function saveDocumentToFirestore(file, cloudinaryData) {

    if (!currentUser) {

        throw new Error(
            "A sessão expirou. Entre novamente na sua conta."
        );

    }


    const documentData = {

        title: file.name,

        originalFileName: file.name,

        fileSize: file.size,

        mimeType: file.type,

        documentUrl: cloudinaryData.secure_url,

        cloudinaryPublicId: cloudinaryData.public_id,

        resourceType: cloudinaryData.resource_type,

        format: cloudinaryData.format || "",

        uid: currentUser.uid,

        email: currentUser.email || "",

        status: "test_uploaded",

        createdAt: serverTimestamp()

    };


    const documentReference = await addDoc(

        collection(db, FIRESTORE_COLLECTION),

        documentData

    );


    return documentReference.id;

}


// =====================================================
// BLOCO 9 — PROCESSO PRINCIPAL
// =====================================================

uploadButton.addEventListener("click", async () => {

    if (uploading) return;

    const file = documentFile.files[0];

    try {

        validateFile(file);

        if (!currentUser) {

            throw new Error(
                "Inicie sessão antes de enviar o documento."
            );

        }


        uploading = true;

        uploadButton.disabled = true;

        uploadButton.textContent = "A enviar...";


        showMessage(
            "A iniciar o teste...",
            "info"
        );


        // PRIMEIRO: CLOUDINARY

        const cloudinaryData = await uploadDocument(file);


        showMessage(
            "Documento enviado para Cloudinary com sucesso.<br>" +
            "A guardar informações no Firestore...",
            "success"
        );


        // SEGUNDO: FIRESTORE

        const firestoreId = await saveDocumentToFirestore(
            file,
            cloudinaryData
        );


        // RESULTADO FINAL

        showMessage(

            "SUCESSO!<br><br>" +

            "Documento enviado para Cloudinary.<br>" +

            "Informações guardadas no Firestore.<br><br>" +

            "<strong>Coleção:</strong> " +
            FIRESTORE_COLLECTION + "<br>" +

            "<strong>ID Firestore:</strong> " +
            firestoreId + "<br><br>" +

            "<strong>URL do documento:</strong><br>" +

            `<a href="${cloudinaryData.secure_url}" target="_blank">Abrir documento</a>`,

            "success"

        );


    } catch (error) {

        console.error("Erro no teste:", error);

        showMessage(

            "<strong>ERRO NO TESTE</strong><br><br>" +
            error.message,

            "error"

        );

    } finally {

        uploading = false;

        uploadButton.disabled = !currentUser;

        uploadButton.textContent = "Enviar documento";

    }

});


// =====================================================
// BLOCO 10 — SELEÇÃO DO DOCUMENTO
// =====================================================

documentFile.addEventListener("change", () => {

    const file = documentFile.files[0];

    if (!file) {

        showMessage(
            "Nenhum documento selecionado.",
            "warning"
        );

        return;

    }


    showMessage(

        "<strong>Documento selecionado:</strong><br>" +

        "Nome: " + file.name + "<br>" +

        "Tipo: " + file.type + "<br>" +

        "Tamanho: " +
        (file.size / 1024 / 1024).toFixed(2) +
        " MB",

        "info"

    );

});

</script>

</body>
</html>
